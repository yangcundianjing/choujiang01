<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
<title>幸运大转盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
body{background:#fff5f5;display:flex;flex-direction:column;align-items:center;padding:20px 15px;}
.title{font-size:22px;color:#e53935;font-weight:bold;margin-bottom:20px;}

.wheel-box{
  position:relative;
  width:300px;
  height:300px;
  margin:0 auto;
}
.arrow{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:36px solid #d32f2f;
  z-index:10;
}
.wheel{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  background:conic-gradient(
    #4caf50 0deg 72deg,    /* 0:四等奖 绿色 */
    #2196f3 72deg 144deg,  /* 1:谢谢参与 蓝色 */
    #9c27b0 144deg 216deg, /* 2:一等奖 紫色 */
    #ff4444 216deg 288deg, /* 3:二等奖 红色 */
    #ff9800 288deg 360deg  /* 4:三等奖 橙色 */
  );
  transition:transform 6s cubic-bezier(0.1,0.7,0.1,1);
}
.wheel::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:80px;
  height:80px;
  background:#fff;
  border-radius:50%;
  z-index:2;
}

/* 文字层：固定不动，永远正向显示 */
.text-layer{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}
.prize-text{
  position:absolute;
  font-weight:bold;
  font-size:14px;
  color:#222;
  width:70px;
  text-align:center;
}
.t0{top:45px;left:50%;transform:translateX(-50%);} /* 四等奖 */
.t1{top:100px;left:230px;}                         /* 谢谢参与 */
.t2{top:210px;left:150px;transform:translateX(-50%);}/* 一等奖 */
.t3{top:100px;left:70px;}                          /* 二等奖 */
.t4{top:45px;left:100px;transform:translateX(-50%);} /* 三等奖 */

.btn{margin-top:30px;padding:12px 35px;font-size:17px;background:#e53935;color:#fff;border:none;border-radius:50px;font-weight:bold;}
.btn:disabled{background:#999;}
.result{margin-top:15px;font-size:17px;font-weight:bold;color:#333;}
</style>
</head>
<body>
<div class="title">🎁 幸运大转盘</div>

<div class="wheel-box">
  <div class="arrow"></div>
  <div class="wheel" id="wheel"></div>
  <!-- 文字固定层，和转盘扇形一一对应 -->
  <div class="text-layer">
    <div class="prize-text t0">四等奖</div>
    <div class="prize-text t1">谢谢参与</div>
    <div class="prize-text t2">一等奖</div>
    <div class="prize-text t3">二等奖</div>
    <div class="prize-text t4">三等奖</div>
  </div>
</div>

<button id="drawBtn" class="btn">开始抽奖</button>
<div class="result" id="result"></div>

<script>
// 【锁死顺序】箭头指向的扇形，对应数组的索引，结果永远和箭头一致
const prizes = ["四等奖","谢谢参与","一等奖","二等奖","三等奖"];
const urlParams = new URLSearchParams(location.search);
const urlCode = urlParams.get("code");
const p0 = parseInt(urlParams.get("p0")) || 30; // 四等奖概率
const p1 = parseInt(urlParams.get("p1")) || 10; // 谢谢参与概率
const p2 = parseInt(urlParams.get("p2")) || 10; // 一等奖概率
const p3 = parseInt(urlParams.get("p3")) || 20; // 二等奖概率
const p4 = parseInt(urlParams.get("p4")) || 30; // 三等奖概率
const forcePrize = parseInt(urlParams.get("force"));
const prizeProb = [p0,p1,p2,p3,p4];

const drawBtn = document.getElementById("drawBtn");
const result = document.getElementById("result");
const wheel = document.getElementById("wheel");

if(!urlCode){
  drawBtn.disabled=true;
  drawBtn.innerText="链接无效";
}
const lockKey = "lottery_lock_" + urlCode;
if(localStorage.getItem(lockKey)){
  drawBtn.disabled=true;
  drawBtn.innerText="已抽过奖，链接作废";
}

let spinning = false;
drawBtn.onclick = function(){
  if(spinning || !urlCode || localStorage.getItem(lockKey)) return;
  spinning = true;
  drawBtn.disabled = true;
  drawBtn.innerText = "抽奖中...";

  let idx = 0;
  if(!isNaN(forcePrize) && forcePrize >= 0){
    // 强制奖项映射：管理员设置的奖项→转盘顺序
    const map = [2,3,4,0,1]; // 0一等奖→2,1二等奖→3,2三等奖→4,3四等奖→0,4谢谢参与→1
    idx = map[forcePrize];
  }else{
    let r = Math.random()*100;
    let sum = 0;
    for(let i=0;i<5;i++){
      sum += prizeProb[i];
      if(r < sum){
        idx = i;
        break;
      }
    }
  }

  // 角度计算：箭头直接停在扇形中心，100%对应奖项
  let rotateDeg = 2000 + Math.random()*800 + (idx * 72 + 36);
  wheel.style.transform = "rotate(" + rotateDeg + "deg)";

  setTimeout(()=>{
    localStorage.setItem(lockKey,"1");
    result.innerText = "🎉 恭喜抽到：" + prizes[idx];
    drawBtn.innerText = "链接已作废";
    spinning = false;
  },6000);
};
</script>
</body>
</html>
