<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
<title>幸运大转盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
body{background:#fff5f5;display:flex;flex-direction:column;align-items:center;padding:20px 15px;}
.title{font-size:22px;color:#e53935;font-weight:bold;margin-bottom:20px;}

.wheel-box{
  position:relative;
  width:300px;
  height:300px;
  margin:0 auto;
}
.arrow{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:36px solid #d32f2f;
  z-index:10;
}
.wheel{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  background:conic-gradient(
    #9c27b0 0deg 72deg,  /* 0:谢谢参与 紫色 */
    #ff4444 72deg 144deg,/* 1:一等奖 红色 */
    #ff9800 144deg 216deg,/*2:二等奖 橙色 */
    #4caf50 216deg 288deg,/*3:三等奖 绿色 */
    #2196f3 288deg 360deg /*4:四等奖 蓝色 */
  );
  transition:transform 6s cubic-bezier(0.1,0.7,0.1,1);
}
.wheel::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:80px;
  height:80px;
  background:#fff;
  border-radius:50%;
  z-index:2;
}

/* 文字固定在转盘上，角度和扇形完全对齐，正向显示 */
.wheel .prize{
  position:absolute;
  top:20px;
  left:50%;
  transform-origin:center 130px;
  width:70px;
  text-align:center;
  font-weight:bold;
  font-size:14px;
  color:#222;
}
.wheel .p0{transform:translateX(-50%) rotate(36deg);}   /* 谢谢参与 */
.wheel .p1{transform:translateX(-50%) rotate(108deg);}  /* 一等奖 */
.wheel .p2{transform:translateX(-50%) rotate(180deg);}  /* 二等奖 */
.wheel .p3{transform:translateX(-50%) rotate(252deg);}  /* 三等奖 */
.wheel .p4{transform:translateX(-50%) rotate(324deg);} /* 四等奖 */

.btn{margin-top:30px;padding:12px 35px;font-size:17px;background:#e53935;color:#fff;border:none;border-radius:50px;font-weight:bold;}
.btn:disabled{background:#999;}
.result{margin-top:15px;font-size:17px;font-weight:bold;color:#333;}
</style>
</head>
<body>
<div class="title">🎁 幸运大转盘</div>

<div class="wheel-box">
  <div class="arrow"></div>
  <div class="wheel" id="wheel">
    <div class="prize p0">谢谢参与</div>
    <div class="prize p1">一等奖</div>
    <div class="prize p2">二等奖</div>
    <div class="prize p3">三等奖</div>
    <div class="prize p4">四等奖</div>
  </div>
</div>

<button id="drawBtn" class="btn">开始抽奖</button>
<div class="result" id="result"></div>

<script>
// 【锁死顺序】奖项和转盘扇形一一对应，箭头指的=这个数组的索引
const prizes = ["谢谢参与","一等奖","二等奖","三等奖","四等奖"];
const urlParams = new URLSearchParams(location.search);
const urlCode = urlParams.get("code");
const p0 = parseInt(urlParams.get("p0")) || 10; // 谢谢参与概率
const p1 = parseInt(urlParams.get("p1")) || 10; // 一等奖概率
const p2 = parseInt(urlParams.get("p2")) || 20; // 二等奖概率
const p3 = parseInt(urlParams.get("p3")) || 30; // 三等奖概率
const p4 = parseInt(urlParams.get("p4")) || 30; // 四等奖概率
const forcePrize = parseInt(urlParams.get("force"));
const prizeProb = [p0,p1,p2,p3,p4];

const drawBtn = document.getElementById("drawBtn");
const result = document.getElementById("result");
const wheel = document.getElementById("wheel");

if(!urlCode){
  drawBtn.disabled=true;
  drawBtn.innerText="链接无效";
}
const lockKey = "lottery_lock_" + urlCode;
if(localStorage.getItem(lockKey)){
  drawBtn.disabled=true;
  drawBtn.innerText="已抽过奖，链接作废";
}

let spinning = false;
drawBtn.onclick = function(){
  if(spinning || !urlCode || localStorage.getItem(lockKey)) return;
  spinning = true;
  drawBtn.disabled = true;
  drawBtn.innerText = "抽奖中...";

  let idx = 0;
  if(!isNaN(forcePrize) && forcePrize >= 0){
    // 强制奖项直接用索引，和转盘顺序一致
    idx = forcePrize;
  }else{
    let r = Math.random()*100;
    let sum = 0;
    for(let i=0;i<5;i++){
      sum += prizeProb[i];
      if(r < sum){
        idx = i;
        break;
      }
    }
  }

  // 角度计算：箭头直接停在扇形中心，和奖项100%对应
  let rotateDeg = 2000 + Math.random()*800 + (idx * 72 + 36);
  wheel.style.transform = "rotate(" + rotateDeg + "deg)";

  setTimeout(()=>{
    localStorage.setItem(lockKey,"1");
    result.innerText = "🎉 恭喜抽到：" + prizes[idx];
    drawBtn.innerText = "链接已作废";
    spinning = false;
  },6000);
};
</script>
</body>
</html>
