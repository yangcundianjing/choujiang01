<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幸运大转盘抽奖</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            min-height:100vh;
            background:#fef5f5;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:20px 15px;
        }
        .title{
            font-size:22px;
            color:#e64340;
            margin-bottom:20px;
            font-weight:bold;
        }
        .wrap{
            width:320px;height:320px;
            position:relative;
        }
        .pointer{
            width:0;height:0;
            border-left:18px solid transparent;
            border-right:18px solid transparent;
            border-top:35px solid #d92929;
            position:absolute;
            top:-10px;
            left:50%;
            transform:translateX(-50%);
            z-index:9;
        }
        .wheel{
            width:100%;height:100%;
            border-radius:50%;
            /* 5个奖品 均分72度一块 */
            background:conic-gradient(
                #ff3333 0deg 72deg,
                #ffaa00 72deg 144deg,
                #33cc33 144deg 216deg,
                #0099ff 216deg 288deg,
                #9966ff 288deg 360deg
            );
            transition: transform 6s cubic-bezier(0.08,0.6,0.2,0.95);
        }
        .wheel::after{
            content:"";
            width:82%;height:82%;
            background:#fff;
            border-radius:50%;
            position:absolute;
            top:9%;left:9%;
        }
        .text-item{
            position:absolute;
            width:100%;height:100%;
            font-size:14px;
            font-weight:bold;
            color:#222;
            text-align:center;
        }
        .text-item span{
            position:absolute;
            left:50%;
            width:60px;
            margin-left:-30px;
            transform-origin:center 160px;
        }
        .text-item span:nth-child(1){transform:rotate(36deg);}
        .text-item span:nth-child(2){transform:rotate(108deg);}
        .text-item span:nth-child(3){transform:rotate(180deg);}
        .text-item span:nth-child(4){transform:rotate(252deg);}
        .text-item span:nth-child(5){transform:rotate(324deg);}

        .btn{
            margin-top:30px;
            padding:12px 35px;
            font-size:18px;
            background:#e64340;
            color:#fff;
            border:none;
            border-radius:50px;
        }
        .btn:disabled{background:#999;}
        .res{margin-top:20px;font-size:16px;color:#333;}
        /* 抽奖记录 仅电脑端可见，手机看不到 */
        .log-box{
            position:fixed;
            right:15px;bottom:15px;
            width:280px;
            padding:15px;
            background:rgba(0,0,0,0.8);
            color:#fff;
            font-size:12px;
            border-radius:8px;
            max-height:220px;
            overflow:auto;
        }
        @media (max-width:768px){.log-box{display:none;}}
    </style>
</head>
<body>
    <div class="title">幸运大转盘抽奖</div>
    <div class="wrap">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <div class="text-item">
                <span>一等奖</span>
                <span>二等奖</span>
                <span>三等奖</span>
                <span>四等奖</span>
                <span>谢谢参与</span>
            </div>
        </div>
    </div>
    <button class="btn" id="btn">开始抽奖</button>
    <div class="res" id="res"></div>

    <!-- 后台记录 只有你电脑能看 -->
    <div class="log-box">
        <div>📋 所有抽奖记录</div>
        <div id="logList"></div>
    </div>

<script>
// 5个奖品
const prizeArr = ["一等奖","二等奖","三等奖","四等奖","谢谢参与"];
let run = false;
let totalDeg = 0;
let hasDraw = localStorage.getItem("drawed")||"";
const wheel = document.getElementById("wheel");
const btn = document.getElementById("btn");
const res = document.getElementById("res");
const logList = document.getElementById("logList");

// 抽过奖禁用按钮
if(hasDraw){
    btn.disabled = true;
    btn.innerText = "已参与抽奖";
}

// 读取历史记录
let allLog = JSON.parse(localStorage.getItem("lotteryLog")||"[]");
function showLog(){
    logList.innerHTML = "";
    allLog.forEach(item=>{
        let p = document.createElement("p");
        p.innerText = item;
        logList.appendChild(p);
    })
}
showLog();

// 抽奖
btn.onclick = function(){
    if(run||hasDraw)return;
    run = true;
    btn.disabled = true;
    btn.innerText = "抽奖中...";
    res.innerText = "";

    // 随机奖品
    let idx = Math.floor(Math.random()*5);
    // 强制转 5~8圈  每圈360度
   let circle = 1800 + Math.floor(Math.random()*1080);
// 定位到对应奖品
let single = 72;
let endDeg = circle + (360 - idx * single);
totalDeg += endDeg;

wheel.style.transform = "rotate("+totalDeg+"deg)";

setTimeout(()=>{
    run = false;
    hasDraw = 1;
    localStorage.setItem("drawed",1);
    btn.innerText = "已参与抽奖";
    res.innerText = "恭喜获得："+prizeArr[idx];

    // 保存记录
    let time = new Date().toLocaleString();
    let msg = time + " | 抽到：" + prizeArr[idx];
    allLog.push(msg);
    localStorage.setItem("lotteryLog",JSON.stringify(allLog));
    showLog();
},6000)
}
</script>
</body>
</html>
