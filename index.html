<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幸运大转盘抽奖</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
        body{
            background:#fff5f5;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:30px 15px;
            min-height:100vh;
        }
        .title{
            font-size:26px;
            color:#e53935;
            font-weight:bold;
            margin-bottom:25px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .wheel-box{
            position:relative;
            width:320px;
            height:320px;
        }
        .arrow{
            position:absolute;
            top:-12px;
            left:50%;
            transform:translateX(-50%);
            width:0;
            height:0;
            border-left:20px solid transparent;
            border-right:20px solid transparent;
            border-top:40px solid #d32f2f;
            z-index:10;
        }
        .wheel{
            width:100%;
            height:100%;
            border-radius:50%;
            position:relative;
            background:conic-gradient(
                #ff4444 0deg 72deg,
                #ff9800 72deg 144deg,
                #4caf50 144deg 216deg,
                #2196f3 216deg 288deg,
                #9c27b0 288deg 360deg
            );
            box-shadow:0 0 20px rgba(0,0,0,0.2);
            transition:transform 6s cubic-bezier(0.1,0.7,0.1,1);
        }
        .wheel::before{
            content:"";
            position:absolute;
            width:78%;
            height:78%;
            background:white;
            border-radius:50%;
            top:11%;
            left:11%;
        }
        .item{
            position:absolute;
            width:100%;
            height:100%;
            text-align:center;
            font-weight:bold;
            font-size:14px;
            color:#222;
        }
        .item span{
            position:absolute;
            left:50%;
            top:20px;
            transform-origin:0 140px;
            width:80px;
            margin-left:-40px;
        }
        /* 关键：修正每个文字的旋转角度，保证正向显示 */
        .item span:nth-child(1){ transform: rotate(36deg); }
        .item span:nth-child(2){ transform: rotate(108deg); }
        .item span:nth-child(3){ transform: rotate(180deg); }
        .item span:nth-child(4){ transform: rotate(252deg); }
        .item span:nth-child(5){ transform: rotate(324deg); }

        .btn{
            margin-top:30px;
            padding:14px 40px;
            font-size:18px;
            background:#e53935;
            color:white;
            border:none;
            border-radius:50px;
            font-weight:bold;
        }
        .btn:disabled{background:#999;}
        .result{
            margin-top:20px;
            font-size:18px;
            color:#333;
            font-weight:bold;
        }
        .log-panel{
            position:fixed;
            bottom:10px;
            right:10px;
            background:rgba(0,0,0,0.8);
            color:white;
            padding:12px;
            font-size:12px;
            border-radius:8px;
            width:260px;
            max-height:200px;
            overflow:auto;
            display:none;
        }
        @media(min-width:768px){.log-panel{display:block;}}
    </style>
</head>
<body>

<div class="title">
    <span>🎁</span>
    幸运大转盘抽奖
</div>
<div class="wheel-box">
    <div class="arrow"></div>
    <div class="wheel" id="wheel">
        <div class="item">
            <span>一等奖</span>
            <span>二等奖</span>
            <span>三等奖</span>
            <span>四等奖</span>
            <span>谢谢参与</span>
        </div>
    </div>
</div>

<button id="btn" class="btn">开始抽奖</button>
<div class="result" id="result"></div>

<div class="log-panel">
    <div>📋 抽奖记录</div>
    <div id="log"></div>
</div>

<script>
// ====================== 【可修改奖品】 ======================
const prizes = ["一等奖","二等奖","三等奖","四等奖","谢谢参与"];
// ============================================================

const wheel = document.getElementById("wheel");
const btn = document.getElementById("btn");
const result = document.getElementById("result");
const log = document.getElementById("log");

let spinning = false;
let totalAngle = 0;

// 每次发新链接 = 新抽奖机会（核心功能！）
let url = new URL(location.href);
let key = "lottery_" + url.search;
let canDraw = !localStorage.getItem(key);

if (!canDraw) {
    btn.disabled = true;
    btn.innerText = "本轮已抽过";
}

// 日志
let logs = JSON.parse(localStorage.getItem("logs") || "[]");
function showLog() {
    log.innerHTML = "";
    logs.forEach(t => {
        let p = document.createElement("p");
        p.innerText = t;
        log.appendChild(p);
    });
}
showLog();

// 抽奖
btn.onclick = function () {
    if (spinning || !canDraw) return;
    spinning = true;
    btn.disabled = true;
    btn.innerText = "抽奖中...";
    result.innerText = "";

    let index = Math.floor(Math.random() * 5);
    let circles = 1800 + Math.floor(Math.random() * 1080);
    // 修正定位：让箭头刚好指向每个奖品的正中间
    let end = circles + (360 - (index * 72 + 36));
    totalAngle += end;

    wheel.style.transform = `rotate(${totalAngle}deg)`;

    setTimeout(() => {
        spinning = false;
        result.innerText = "🎉 恭喜你抽到：" + prizes[index];
        btn.innerText = "本轮已抽过";

        localStorage.setItem(key, "true");
        canDraw = false;

        let time = new Date().toLocaleString();
        logs.push(time + " → " + prizes[index]);
        localStorage.setItem("logs", JSON.stringify(logs));
        showLog();
    }, 6000);
};
</script>
</body>
</html>
