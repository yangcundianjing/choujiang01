<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幸运大转盘</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
        body{
            background:#fff5f5;
            display:flex;flex-direction:column;align-items:center;
            padding:30px 15px;min-height:100vh;
        }
        .title{font-size:24px;color:#e53935;font-weight:bold;margin-bottom:25px;}
        .wheel-box{position:relative;width:320px;height:320px;}
        .arrow{
            position:absolute;top:-12px;left:50%;transform:translateX(-50%);
            width:0;height:0;
            border-left:20px solid transparent;
            border-right:20px solid transparent;
            border-top:40px solid #d32f2f;
            z-index:10;
        }
        .wheel{
            width:100%;height:100%;border-radius:50%;
            background:conic-gradient(
                #ff4444 0deg 72deg,    /* 一等奖 红 */
                #ff9800 72deg 144deg,   /* 二等奖 橙 */
                #4caf50 144deg 216deg,  /* 三等奖 绿 */
                #2196f3 216deg 288deg,  /* 四等奖 蓝 */
                #9c27b0 288deg 360deg   /* 谢谢参与 紫 */
            );
            transition:transform 6s cubic-bezier(0.1,0.7,0.1,1);
            box-shadow:0 0 20px rgba(0,0,0,0.2);
        }
        .wheel::before{
            content:"";position:absolute;
            width:30%;height:30%;background:#fff;
            border-radius:50%;top:35%;left:35%;
        }
        /* 文字精准居中 */
        .text-layer{position:absolute;inset:0;pointer-events:none;}
        .prize-text{
            position:absolute;font-weight:bold;font-size:14px;color:#222;
            width:60px;text-align:center;
            transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
        }
        .text-1{top:55px;left:50%;}  /* 一等奖 */
        .text-2{top:130px;left:270px;}/* 二等奖 */
        .text-3{top:230px;left:50%;} /* 三等奖 */
        .text-4{top:130px;left:50px;} /* 四等奖 */
        .text-5{top:55px;left:80px;}  /* 谢谢参与 */

        .btn{
            margin-top:30px;padding:14px 40px;
            font-size:18px;background:#e53935;color:#fff;
            border:none;border-radius:50px;font-weight:bold;
            cursor:pointer;
        }
        .btn:disabled{background:#999;cursor:not-allowed;}
        .result{margin-top:20px;font-size:18px;font-weight:bold;color:#333;}
        
        /* 管理员面板（仅电脑可见） */
        .admin-panel{
            position:fixed;top:10px;right:10px;
            background:#fff;padding:15px;border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            display:none;
            min-width:350px;
        }
        @media(min-width:768px){.admin-panel{display:block;}}
        .admin-panel h3{color:#e53935;margin-bottom:10px;font-size:16px;}
        .admin-panel .item{margin:8px 0;display:flex;align-items:center;gap:10px;}
        .admin-panel input{width:60px;padding:5px;border:1px solid #ddd;border-radius:5px;text-align:center;}
        .admin-panel button{
            padding:8px 15px;margin:5px 0;background:#2196f3;color:#fff;
            border:none;border-radius:5px;font-size:14px;cursor:pointer;
        }
        .admin-panel .reset-btn{background:#e53935;}
        .admin-log{
            position:fixed;bottom:10px;right:10px;
            background:rgba(0,0,0,.8);color:#fff;padding:12px;
            font-size:12px;border-radius:8px;width:260px;max-height:220px;overflow:auto;
            display:none;
        }
        @media(min-width:768px){.admin-log{display:block;}}
    </style>
</head>

<body>
<div class="title">🎁 幸运大转盘</div>
<div class="wheel-box">
    <div class="arrow"></div>
    <div class="wheel" id="wheel"></div>
    <div class="text-layer">
        <div class="prize-text text-1">一等奖</div>
        <div class="prize-text text-2">二等奖</div>
        <div class="prize-text text-3">三等奖</div>
        <div class="prize-text text-4">四等奖</div>
        <div class="prize-text text-5">谢谢参与</div>
    </div>
</div>

<button id="drawBtn" class="btn">开始抽奖</button>
<div class="result" id="result"></div>

<!-- 管理员面板（精准控权） -->
<div class="admin-panel">
    <h3>🔧 管理员控制面板</h3>
    <!-- 概率调整 -->
    <div class="item">
        <label>一等奖概率(%):</label>
        <input type="number" id="prob1" value="10" min="0" max="100">
    </div>
    <div class="item">
        <label>二等奖概率(%):</label>
        <input type="number" id="prob2" value="20" min="0" max="100">
    </div>
    <div class="item">
        <label>三等奖概率(%):</label>
        <input type="number" id="prob3" value="30" min="0" max="100">
    </div>
    <div class="item">
        <label>四等奖概率(%):</label>
        <input type="number" id="prob4" value="30" min="0" max="100">
    </div>
    <div class="item">
        <label>谢谢参与概率(%):</label>
        <input type="number" id="prob5" value="10" min="0" max="100">
    </div>
    <button onclick="saveProb()">保存概率设置</button>
    
    <!-- 精准重置（指定用户） -->
    <div class="item" style="margin-top:15px;border-top:1px solid #eee;padding-top:10px;">
        <label>重置指定用户:</label>
        <input type="text" id="resetUser" placeholder="输入用户名（如张三）">
        <button class="reset-btn" onclick="resetUserLink()">重置该用户权限</button>
    </div>
    <button onclick="clearAllLogs()">清空抽奖记录</button>
</div>

<div class="admin-log">
    <div>📋 抽奖记录</div>
    <div id="logList"></div>
</div>

<script>
// ====================== 【核心配置】 ======================
const ADMIN_KEY = "cdj6688";          // 核心密码
const ADMIN_PASSWORD = "admin6688";   // 管理员密码
const ALLOWED_NUM = ["1"];           // 仅num=1有效
// 默认概率
let prizeProb = {
    1: 10, 2: 20, 3: 30, 4: 30, 5: 10
};
// ==========================================================

const prizes = ["一等奖","二等奖","三等奖","四等奖","谢谢参与"];
const drawBtn = document.getElementById("drawBtn");
const result = document.getElementById("result");
const logList = document.getElementById("logList");

let spinning = false;
let totalAngle = 0;
// 生成用户唯一标识（每个用户不同，无法伪造）
let userUniqueId = localStorage.getItem("user_unique_id") || (() => {
    let id = Math.random().toString(36).substr(2, 16) + Date.now();
    localStorage.setItem("user_unique_id", id);
    return id;
})();

// ==================== 1. 链接验证 ====================
let urlParams = new URLSearchParams(window.location.search);
let userKey = urlParams.get("key");
let userNum = urlParams.get("num");
let isLinkValid = (userKey === ADMIN_KEY) && (userNum === "1");

if (!isLinkValid) {
    drawBtn.disabled = true;
    drawBtn.innerText = "链接无效，请联系发起人";
}

// ==================== 2. 单人专属锁（核心！） ====================
// 锁的格式：lock_用户ID_num1 → 只锁当前用户，不影响其他人
let userLockKey = `lock_${userUniqueId}_num1`;
let isUserLocked = localStorage.getItem(userLockKey);

if (isUserLocked) {
    drawBtn.disabled = true;
    drawBtn.innerText = "本轮已抽完";
}

// ==================== 3. 加载概率+记录 ====================
if (localStorage.getItem("prizeProb")) {
    prizeProb = JSON.parse(localStorage.getItem("prizeProb"));
    document.getElementById("prob1").value = prizeProb[1];
    document.getElementById("prob2").value = prizeProb[2];
    document.getElementById("prob3").value = prizeProb[3];
    document.getElementById("prob4").value = prizeProb[4];
    document.getElementById("prob5").value = prizeProb[5];
}

function loadLogs() {
    let logs = JSON.parse(localStorage.getItem("lotteryLogs") || "[]");
    logList.innerHTML = "";
    logs.forEach(item => {
        let p = document.createElement("p");
        p.innerText = item;
    });
}
loadLogs();

// ==================== 4. 保存概率 ====================
function saveProb() {
    let p1 = Number(document.getElementById("prob1").value);
    let p2 = Number(document.getElementById("prob2").value);
    let p3 = Number(document.getElementById("prob3").value);
    let p4 = Number(document.getElementById("prob4").value);
    let p5 = Number(document.getElementById("prob5").value);
    
    if (p1 + p2 + p3 + p4 + p5 !== 100) {
        alert(`概率总和必须为100%！当前：${p1+p2+p3+p4+p5}%`);
        return;
    }
    
    prizeProb = {1:p1, 2:p2, 3:p3, 4:p4, 5:p5};
    localStorage.setItem("prizeProb", JSON.stringify(prizeProb));
    alert("概率保存成功！");
}

// ==================== 5. 抽奖逻辑（单人锁） ====================
drawBtn.onclick = function () {
    if (spinning || isUserLocked || !isLinkValid) return;
    
    spinning = true;
    drawBtn.disabled = true;
    drawBtn.innerText = "抽奖中...";
    result.innerText = "";

    // 自定义概率抽奖
    let random = Math.random() * 100;
    let idx = 4; // 默认谢谢参与
    if (random < prizeProb[1]) idx = 0;
    else if (random < prizeProb[1]+prizeProb[2]) idx = 1;
    else if (random < prizeProb[1]+prizeProb[2]+prizeProb[3]) idx = 2;
    else if (random < prizeProb[1]+prizeProb[2]+prizeProb[3]+prizeProb[4]) idx = 3;

    // 转盘旋转
    let circles = 1800 + Math.floor(Math.random() * 1080);
    let endDeg = circles + (360 - (idx * 72 + 36));
    totalAngle += endDeg;
    document.getElementById("wheel").style.transform = `rotate(${totalAngle}deg)`;

    // 抽奖完成 → 锁当前用户
    setTimeout(() => {
        spinning = false;
        localStorage.setItem(userLockKey, "locked");
        isUserLocked = true;
        
        result.innerText = "🎉 恭喜抽到：" + prizes[idx];
        drawBtn.innerText = "本轮已抽完";

        // 记录（含用户名，方便你核对）
        let time = new Date().toLocaleString();
        let logs = JSON.parse(localStorage.getItem("lotteryLogs") || "[]");
        logs.push(`【用户ID:${userUniqueId.slice(-4)}】${time} → ${prizes[idx]}`);
        localStorage.setItem("lotteryLogs", JSON.stringify(logs));
        loadLogs();
    }, 6000);
};

// ==================== 6. 精准重置（指定用户） ====================
function resetUserLink() {
    let pwd = prompt("请输入管理员密码：");
    if (pwd !== ADMIN_PASSWORD) {
        alert("密码错误！");
        return;
    }
    
    let userName = document.getElementById("resetUser").value.trim();
    if (!userName) {
        alert("请输入要重置的用户名（如张三）！");
        return;
    }

    // 方式1：让用户提供「用户ID后4位」（更精准）
    let userIdSuffix = prompt(`请输入${userName}的用户ID后4位（用户抽奖记录里能看到）：`);
    if (!userIdSuffix) return;

    // 遍历所有缓存，找到对应用户的锁并删除
    let resetSuccess = false;
    for (let i = 0; i < localStorage.length; i++) {
        let key = localStorage.key(i);
        if (key.startsWith("lock_") && key.includes(userIdSuffix) && key.includes("num1")) {
            localStorage.removeItem(key);
            resetSuccess = true;
            break;
        }
    }

    if (resetSuccess) {
        alert(`已重置${userName}的抽奖权限！${userName}可重新抽奖`);
    } else {
        alert("未找到该用户的抽奖记录，请核对ID后4位！");
    }
}

// 清空记录
function clearAllLogs() {
    let pwd = prompt("管理员密码：");
    if (pwd !== ADMIN_PASSWORD) return;
    localStorage.removeItem("lotteryLogs");
    loadLogs();
    alert("记录已清空！");
}
</script>
</body>
</html>
