<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>抽奖链接管理员生成器</title>
<style>
body{max-width:600px;margin:50px auto;padding:20px;font-family:微软雅黑;}
.box{padding:20px;border:1px solid #eee;border-radius:10px;margin-bottom:20px;}
h3{color:#e53935;}
input,select{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px;}
button{padding:10px 20px;background:#e53935;color:#fff;border:none;border-radius:5px;cursor:pointer;margin:5px 0;}
.link{margin-top:15px;padding:10px;background:#f5f5f5;border-radius:5px;word-break:break-all;}
.prob-item{display:flex;align-items:center;gap:10px;margin:8px 0;}
.prob-item span{width:80px;}
</style>
</head>
<body>
<div class="box">
    <h3>🔧 消费满100元 生成专属抽奖链接</h3>
    <input type="text" id="name" placeholder="输入客户备注/昵称（随便填）">
    <button onclick="createLink()">生成专属微信抽奖链接</button>
    <div class="link" id="linkBox" style="display:none;"></div>
</div>

<!-- 概率调整+手动控奖区域 -->
<div class="box">
    <h3>⚙️ 中奖设置（仅你可见）</h3>
    <div class="prob-item">
        <span>一等奖：</span>
        <input type="number" id="p0" value="10" min="0" max="100"> %
    </div>
    <div class="prob-item">
        <span>二等奖：</span>
        <input type="number" id="p1" value="20" min="0" max="100"> %
    </div>
    <div class="prob-item">
        <span>三等奖：</span>
        <input type="number" id="p2" value="30" min="0" max="100"> %
    </div>
    <div class="prob-item">
        <span>四等奖：</span>
        <input type="number" id="p3" value="30" min="0" max="100"> %
    </div>
    <div class="prob-item">
        <span>谢谢参与：</span>
        <input type="number" id="p4" value="10" min="0" max="100"> %
    </div>
    <button onclick="setForcePrize()">强制指定奖项</button>
    <select id="forcePrizeSelect" style="display:none;">
        <option value="-1">不强制（按概率）</option>
        <option value="0">强制一等奖</option>
        <option value="1">强制二等奖</option>
        <option value="2">强制三等奖</option>
        <option value="3">强制四等奖</option>
        <option value="4">强制谢谢参与</option>
    </select>
</div>

<script>
const baseUrl = "https://yangcundianjing.github.io/choujiang01/lottery.html";
let forcePrize = -1;

// 打开/关闭强制奖项选择框
function setForcePrize() {
    const select = document.getElementById("forcePrizeSelect");
    select.style.display = select.style.display === "none" ? "block" : "none";
    alert("强制奖项设置已展开，选择后重新生成链接生效");
}

function createLink(){
    let name = document.getElementById("name").value.trim();
    if(!name){alert("请输入客户备注");return;}

    // 读取概率设置
    let p0 = parseInt(document.getElementById("p0").value) || 0;
    let p1 = parseInt(document.getElementById("p1").value) || 0;
    let p2 = parseInt(document.getElementById("p2").value) || 0;
    let p3 = parseInt(document.getElementById("p3").value) || 0;
    let p4 = parseInt(document.getElementById("p4").value) || 0;
    const total = p0 + p1 + p2 + p3 + p4;
    if(total !== 100){
        alert(`概率总和必须等于100%，当前为${total}%，请调整`);
        return;
    }

    // 读取强制奖项
    forcePrize = parseInt(document.getElementById("forcePrizeSelect").value);

    // 生成带参数的链接
    let code = Math.random().toString(36).slice(2) + Date.now();
    let params = new URLSearchParams();
    params.append("code", code);
    params.append("p0", p0);
    params.append("p1", p1);
    params.append("p2", p2);
    params.append("p3", p3);
    params.append("p4", p4);
    if(forcePrize >= 0){
        params.append("force", forcePrize);
    }
    let link = baseUrl + "?" + params.toString();
    
    document.getElementById("linkBox").innerText = "专属链接：\n" + link;
    document.getElementById("linkBox").style.display = "block";
}
</script>
</body>
</html>
